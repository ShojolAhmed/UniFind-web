# Render Blueprint for the UniFind backend (Django REST API) + Postgres.
# Deploy: push to GitHub, then in Render choose "New +" -> "Blueprint" and
# point it at this repository. After the first deploy, set the frontend
# origin(s) and Cloudinary credentials in the service's Environment tab.

databases:
  - name: unifind-db
    plan: free
    databaseName: unifind
    user: unifind

services:
  - type: web
    name: unifind-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate && python manage.py ensure_superuser"
    startCommand: "gunicorn lost_and_found.wsgi:application"
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      # Enable HSTS on the real HTTPS domain (30 days). Safe here because this
      # only ever runs on https://<service>.onrender.com, never on localhost.
      - key: SECURE_HSTS_SECONDS
        value: "2592000"
      - key: DATABASE_URL
        fromDatabase:
          name: unifind-db
          property: connectionString
      # Comma-separated frontend origin(s), e.g. https://unifind.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Trust the frontend + this backend for CSRF (admin / browsable API).
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      # Optional extra hostnames (the Render hostname is added automatically).
      - key: ALLOWED_HOSTS
        sync: false
      # Cloudinary media storage: cloudinary://API_KEY:API_SECRET@CLOUD_NAME
      - key: CLOUDINARY_URL
        sync: false
      # Initial admin account, created on deploy by `manage.py ensure_superuser`
      # (idempotent). Set these in the dashboard; they are never committed.
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
