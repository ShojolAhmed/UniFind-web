{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login · UniFind</title>
<link rel="stylesheet" href="{% static 'css/unifind.css' %}">
</head>
<body>

<div class="auth-screen">

  <div class="auth-card">

    <div class="auth-stub">
      <div class="brand">
          <div class="brand-mark">U</div>
          <span class="name">UniFind</span>
      </div>
      <h1>Welcome back</h1>
      <p>Sign in to report or recover lost items</p>
    </div>

    <div class="auth-perforation"></div>

    <div class="auth-body">
      <form method="POST">

        {% csrf_token %}

        {{form.as_p}}

        <button type="submit" class="btn btn-amber btn-block">Sign in</button>

      </form>
    </div>

    <div class="auth-footer-note">
      <p>Don't have an account? <a href="/signup">Create one →</a></p>
    </div>

  </div>

</div>

</body>
</html>
