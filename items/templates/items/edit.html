{% load static %}
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Item | UniFind</title>
<link rel="stylesheet" href="{% static 'css/unifind.css' %}">
</head>

<body>

<div class="app-shell">

<div class="topnav-mobile">
    <button class="hamburger" id="sidebarToggle" aria-label="Open menu">☰</button>
    <div class="brand-mini"><span class="brand-mark-mini">U</span> UniFind</div>
</div>

<div class="sidebar-backdrop" id="sidebarBackdrop"></div>

<aside class="sidebar" id="sidebar">
    <div class="brand">
        <div class="brand-mark">U</div>
        <div class="brand-text">
            <h1>UniFind</h1>
            <p>Lost &amp; Found</p>
        </div>
    </div>

    <nav class="nav-group">
        <a class="nav-link" href="/">Home</a>
        <a class="nav-link" href="/add">+ Add Item</a>
    </nav>
</aside>

<div class="main">

    <div class="form-page">

        <div class="form-wrap">

            <p class="eyebrow">Update report</p>
            <h2 class="page-title">Edit Item</h2>

            <div class="card">

                <form method="POST" enctype="multipart/form-data">

                    {% csrf_token %}

                    {{form.as_p}}

                    <button class="btn btn-ink btn-block">Save Changes</button>

                </form>

            </div>

        </div>

    </div>

</div>

</div>

<script src="{% static 'js/unifind.js' %}"></script>

</body>
</html>
