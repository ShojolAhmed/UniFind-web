<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Item | UniFind</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">

<style>

:root{
    --ink:#12192b;
    --ink-soft:#5a6478;
    --paper:#eef1f6;
    --surface:#ffffff;
    --line:#d7dee8;
    --amber:#f2a93b;
    --found:#1f8a5f;
    --radius:16px;
}

*{box-sizing:border-box;}

body{
    margin:0;
    font-family:'Inter',Arial,sans-serif;
    background:var(--paper);
    color:var(--ink);
}

a{color:inherit;}

.app-shell{
    display:flex;
    min-height:100vh;
}

.sidebar{
    width:240px;
    flex-shrink:0;
    background:var(--ink);
    color:#e7eaf1;
    min-height:100vh;
    position:sticky;
    top:0;
    padding:26px 20px;
    display:flex;
    flex-direction:column;
    gap:28px;
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
}

.brand-mark{
    width:40px;
    height:40px;
    border-radius:50%;
    border:2px dashed var(--amber);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    color:var(--amber);
    flex-shrink:0;
}

.brand-text h1{
    margin:0;
    font-family:'Space Grotesk',sans-serif;
    font-size:19px;
}

.brand-text p{
    margin:2px 0 0;
    font-size:11px;
    color:#8b93a7;
    font-family:'IBM Plex Mono',monospace;
    letter-spacing:.05em;
    text-transform:uppercase;
}

.nav-group{
    display:flex;
    flex-direction:column;
    gap:4px;
}

.nav-link{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 12px;
    border-radius:10px;
    text-decoration:none;
    color:#c8cede;
    font-size:14px;
    font-weight:500;
}

.nav-link:hover{
    background:rgba(242,169,59,0.1);
    color:#ffffff;
}

.nav-link.primary{
    background:var(--amber);
    color:#20140a;
    font-weight:600;
}

.main{
    flex:1;
    min-width:0;
    padding:48px 40px;
    display:flex;
    justify-content:center;
}

.ticket-form{
    width:100%;
    max-width:520px;
}

.eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin:0 0 4px;
}

h2.title{
    margin:0 0 24px;
    font-family:'Space Grotesk',sans-serif;
    font-size:26px;
}

.card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:30px;
    box-shadow:0 1px 2px rgba(18,25,43,0.05);
}

form p{
    display:flex;
    flex-direction:column;
    margin-bottom:16px;
}

form p label{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.05em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:6px;
}

input,
textarea,
select{
    width:100%;
    padding:12px;
    border:1px solid var(--line);
    border-radius:10px;
    background:var(--paper);
    font-family:'Inter',sans-serif;
    font-size:14px;
    box-sizing:border-box;
}

input:focus,
textarea:focus,
select:focus{
    outline:none;
    background:white;
    border-color:var(--ink);
}

button{
    width:100%;
    padding:14px;
    background:var(--found);
    color:white;
    border:none;
    border-radius:10px;
    font-size:15px;
    font-weight:600;
    margin-top:6px;
}

button:hover{
    cursor:pointer;
    background:#186e4b;
}

#image-preview{
    display:none;
    width:100%;
    margin-top:6px;
    margin-bottom:16px;
    border-radius:10px;
    border:1px solid var(--line);
    object-fit:contain;
    max-height:280px;
}

@media(max-width:900px){
    .app-shell{ flex-direction:column; }
    .sidebar{ width:100%; min-height:auto; position:relative; flex-direction:row; align-items:center; flex-wrap:wrap; }
    .main{ padding:28px 18px; }
}

</style>

</head>

<body>

<div class="app-shell">

<aside class="sidebar">
    <div class="brand">
        <div class="brand-mark">U</div>
        <div class="brand-text">
            <h1>UniFind</h1>
            <p>Lost &amp; Found</p>
        </div>
    </div>

    <nav class="nav-group">
        <a class="nav-link" href="/">Home</a>
        <a class="nav-link primary" href="/add">+ Add Item</a>
    </nav>
</aside>

<div class="main">

    <div class="ticket-form">

        <p class="eyebrow">New report</p>
        <h2 class="title">Add Lost / Found Item</h2>

        <div class="card">

            <form method="POST" enctype="multipart/form-data">

                {% csrf_token %}

                {{form.as_p}}

                <img id="image-preview" src="" alt="Image Preview">

                <button>Submit Item</button>

            </form>

        </div>

    </div>

</div>

</div>

<script>
document.getElementById('id_image').addEventListener('change', function(event) {
    var file = event.target.files[0];

    if (!file) {
        return;
    }

    var reader = new FileReader();

    reader.onload = function(e) {
        var preview = document.getElementById('image-preview');
        preview.src = e.target.result;
        preview.style.display = 'block';
    };

    reader.readAsDataURL(file);
});
</script>

</body>
</html>
