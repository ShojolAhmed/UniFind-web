{% load static %}
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up · UniFind</title>
<link rel="stylesheet" href="{% static 'css/unifind.css' %}">
</head>

<body>

<div class="auth-screen">

    <div class="auth-card">

        <div class="auth-stub">
            <div class="brand">
                <div class="brand-mark">U</div>
                <span class="name">UniFind</span>
            </div>
            <h1>Create Account</h1>
            <p>Join your campus lost &amp; found network</p>
        </div>

        <div class="auth-perforation"></div>

        <div class="auth-body">

            <form method="POST">

                {% csrf_token %}

                {{form.as_p}}

                <button class="btn btn-success btn-block">Register</button>

            </form>

        </div>

        <div class="auth-footer-note">
            <p>Already have an account? <a href="/login">Login</a></p>
        </div>

    </div>

</div>

</body>
</html>
