<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up · UniFind</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">

<style>
*, *::before, *::after{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --ink:#12192b;
    --ink-soft:#5a6478;
    --paper:#eef1f6;
    --surface:#ffffff;
    --line:#d7dee8;
    --amber:#f2a93b;
    --found:#1f8a5f;
}

body{
    font-family:'Inter',system-ui,sans-serif;
    background:var(--paper);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 16px;
}

.ticket{
    width:100%;
    max-width:400px;
    background:var(--surface);
    border-radius:20px;
    border:1px solid var(--line);
    overflow:hidden;
    box-shadow:0 1px 2px rgba(18,25,43,0.05), 0 24px 48px rgba(18,25,43,0.08);
}

.stub{
    background:var(--ink);
    padding:34px 36px 28px;
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:18px;
}

.brand-mark{
    width:38px;
    height:38px;
    border-radius:50%;
    border:2px dashed var(--amber);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    color:var(--amber);
    flex-shrink:0;
}

.brand span.name{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:16px;
    color:#ffffff;
}

.stub h1{
    font-family:'Space Grotesk',sans-serif;
    font-size:24px;
    font-weight:700;
    color:#ffffff;
}

.stub p{
    margin-top:6px;
    font-size:14px;
    color:rgba(255,255,255,0.55);
}

.perforation{
    height:0;
    border-top:2px dashed var(--line);
    position:relative;
}

.perforation::before,
.perforation::after{
    content:'';
    position:absolute;
    top:-9px;
    width:18px;
    height:18px;
    border-radius:50%;
    background:var(--paper);
}

.perforation::before{ left:-9px; }
.perforation::after{ right:-9px; }

.body{
    padding:30px 36px 32px;
}

form p{
    display:flex;
    flex-direction:column;
    margin-bottom:16px;
}

form p label{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.05em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:6px;
}

input{
    width:100%;
    padding:12px 14px;
    font-size:14px;
    border:1px solid var(--line);
    border-radius:10px;
    background:var(--paper);
}

input:focus{
    outline:none;
    background:white;
    border-color:var(--ink);
}

button{
    width:100%;
    padding:14px;
    border:none;
    background:var(--found);
    color:white;
    border-radius:10px;
    font-size:15px;
    font-weight:700;
    margin-top:4px;
}

button:hover{
    cursor:pointer;
    background:#186e4b;
}

a{
    color:var(--ink);
    font-weight:700;
    text-decoration:none;
    border-bottom:1px solid var(--amber);
}

.bottom{
    text-align:center;
    padding:0 36px 30px;
    font-size:14px;
    color:var(--ink-soft);
}

@media(max-width:480px){
    .stub, .body, .bottom{
        padding-left:24px;
        padding-right:24px;
    }
}
</style>

</head>

<body>

<div class="ticket">

    <div class="stub">
        <div class="brand">
            <div class="brand-mark">U</div>
            <span class="name">UniFind</span>
        </div>
        <h1>Create Account</h1>
        <p>Join your campus lost &amp; found network</p>
    </div>

    <div class="perforation"></div>

    <div class="body">

        <form method="POST">

            {% csrf_token %}

            {{form.as_p}}

            <button>Register</button>

        </form>

    </div>

    <p class="bottom">
        Already have an account?
        <a href="/login">Login</a>
    </p>

</div>

</body>
</html>
